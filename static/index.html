<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet.js Libraries for Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-4xl font-extrabold text-center mb-8 text-blue-700 tracking-tight">AI Travel Planner</h1>
        
        <!-- Input Form -->
        <div class="bg-white p-6 rounded-2xl shadow-xl mb-8 max-w-4xl mx-auto border border-gray-100">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <input type="text" id="destination" placeholder="Where to? (e.g., Goa)" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 bg-gray-50">
                <input type="number" id="days" placeholder="How many days?" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 bg-gray-50">
                <input type="text" id="interests" placeholder="Interests? (e.g., beaches, history)" class="p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 bg-gray-50">
            </div>
            <button id="generate-btn" onclick="generateTrip()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md hover:shadow-lg">
                Generate Interactive Route
            </button>
            <p id="loading" class="text-center text-blue-500 font-semibold mt-4 hidden animate-pulse">Plotting coordinates and finding hotels... Please wait.</p>
        </div>

        <!-- New Split-Screen Dashboard -->
        <div id="results-dashboard" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Left Column: Scrollable Itinerary Cards -->
            <div class="flex flex-col space-y-6 overflow-y-auto max-h-[75vh] pr-2 custom-scrollbar">
                <div id="itinerary-cards" class="space-y-6"></div>
            </div>
            
            <!-- Right Column: Sticky Interactive Map -->
            <div class="relative w-full h-[500px] lg:h-[75vh] sticky top-4 rounded-2xl overflow-hidden shadow-2xl border border-gray-200">
                <div id="map" class="w-full h-full z-0"></div>
            </div>
            
        </div>
    </div>

    <script>
        let map;
        let markersGroup;
        let routeLine;

        function initMap() {
            if (!map) {
                map = L.map('map').setView([20.5937, 78.9629], 4);
                
                // FIX: Use the 100% free OpenStreetMap tiles instead of CARTO
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    maxZoom: 19
                }).addTo(map);
                
                markersGroup = L.layerGroup().addTo(map);
            }
        }

        async function generateTrip() {
            const dest = document.getElementById('destination').value;
            const days = document.getElementById('days').value;
            const interests = document.getElementById('interests').value.split(',');

            if (!dest || !days) return alert("Please enter a destination and duration.");

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('generate-btn').disabled = true;
            document.getElementById('results-dashboard').classList.add('hidden');
            document.getElementById('itinerary-cards').innerHTML = '';

            try {
                // Fetch JSON data instead of a text stream
                const response = await fetch('/api/v1/plan-trip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        destination: dest,
                        duration_days: parseInt(days),
                        interests: interests.map(i => i.trim())
                    })
                });

                if (!response.ok) throw new Error("Failed to fetch itinerary.");
                const data = await response.json();
                
                // Show dashboard and reset map layers
                document.getElementById('results-dashboard').classList.remove('hidden');
                initMap();
                markersGroup.clearLayers();
                if (routeLine) map.removeLayer(routeLine);

                const coordinates = [];
                const cardsContainer = document.getElementById('itinerary-cards');

                // Loop through the AI JSON and build the UI
                data.itinerary.forEach(dayPlan => {
                    let activitiesHtml = '';
                    
                    // Add Activities and Map Pins
                    dayPlan.activities.forEach((act) => {
                        activitiesHtml += `<li class="ml-5 mb-3 text-gray-700"><b>📍 ${act.name}:</b> ${act.description}</li>`;
                        addMapPin(act.latitude, act.longitude, `<b>${act.name}</b><br>${act.description}`);
                        coordinates.push([act.latitude, act.longitude]);
                    });

                    // Add Hotel and Map Pin
                    const h = dayPlan.hotel;
                    activitiesHtml += `<div class="mt-4 p-4 bg-blue-50 rounded-xl text-blue-900 border border-blue-100 shadow-sm">
                                        <b>🏨 Stay: ${h.name}</b><br><span class="text-sm">${h.description}</span>
                                       </div>`;
                    addMapPin(h.latitude, h.longitude, `<b>🏨 ${h.name}</b><br>${h.description}`);
                    coordinates.push([h.latitude, h.longitude]);

                    // Inject the day card into the sidebar
                    cardsContainer.innerHTML += `
                        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 hover:shadow-xl transition-shadow duration-300">
                            <h2 class="text-2xl font-bold text-gray-800 mb-2 border-b pb-2">Day ${dayPlan.day}: ${dayPlan.theme}</h2>
                            <ul class="mt-4 list-disc marker:text-blue-500">${activitiesHtml}</ul>
                        </div>
                    `;
                });

                // Draw the connecting route and auto-zoom to fit the journey
                if (coordinates.length > 0) {
                    routeLine = L.polyline(coordinates, { color: '#2563eb', weight: 4, dashArray: '8, 8' }).addTo(map);
                    map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
                }

            } catch (error) {
                alert(error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('generate-btn').disabled = false;
            }
        }

        function addMapPin(lat, lng, popupText) {
            const marker = L.marker([lat, lng]).bindPopup(popupText);
            markersGroup.addLayer(marker);
        }
    </script>
</body>
</html>
